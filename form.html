<form>
    <input id="upload_medias" name="upload_medias" type="file" />
    <button id="submit">Submit</button>
</form>

<script>
    let data = {
        "title": "Test " + Date.now(),
        "caption": "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.",
        "upload_medias": [],
        "profile_id": 3,
        "callaborators_ids": [1, 4318],
        "period": { "start_datetime": "2018-11-20T15:58:44-06:00", "end_datetime": "2018-11-20T15:58:44-06:01" },
        "sectors_ids": [13, 25],
        "location_type": "online_physical",
        "geolocation_latitude": "9",
        "geolocation_longitude": "2",
        "geographical_scope": "specific",
        "scope_countries_codes": ["ng"],
        "type": "call"
    };

    const fileInput = document.querySelector('#upload_medias');

    async function uploadData() {
        const formData = new FormData();

        Object.entries(data).forEach(([key, value]) => {
            formData.append(key, value);
        });

        if (fileInput.files.length > 0) {
            formData.append('upload_medias', fileInput.files[0]);
        }

        try {
            const response = await fetch('https://example.com/api/upload', {
                method: 'POST',
                body: formData,
            });

            const result = await response.json();
            console.log('Upload success:', result);
        } catch (error) {
            console.error('Upload error:', error);
        }
    }
</script>

<script>
    document.querySelector('#submit').addEventListener('click', uploadData);
</script>
